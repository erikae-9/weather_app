<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eriks Väder, widget</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
/* Kompakt sida för en hemskärmswidget (en app som visar en webbsida i en
   widget). Platsen anges i adressen, eftersom widgetappen inte delar
   lagring med webbläsaren:
     widget.html?plats=Skråmträsk&lat=64.662&lon=20.624
   Valfritt: &kalla=met|smhi|blend, &tema=ljus|mork, &bakgrund=genomskinlig,
   &demo=1. Kortet anpassar sig efter widgetens storlek. */
:root {
  --bg: #ffffff; --ink: #142235; --ink-2: #46566b; --ink-3: #68788b; --line: #dde3ea;
  --accent: #1a5cbd; --warm: #c9402e; --cold: #2a6fc4; --precip: #2c84d4;
  --w-yellow: #e9b800; --w-orange: #ec7a00; --w-red: #d2232f;
  --ic-sun: #f0a500; --ic-moon: #95a7bf; --ic-cloud: #c4cedb; --ic-cloud-dark: #8293a8;
  --ic-rain: #2c84d4; --ic-snow: #5d98d6; --ic-bolt: #f0b000; --ic-fog: #98a5b4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141b; --ink: #e7edf4; --ink-2: #b0bfcf; --ink-3: #8696a9; --line: #233040;
    --accent: #6ea8ff; --warm: #ff7d69; --cold: #6cb0ff; --precip: #58acff;
    --w-yellow: #f2c83a; --w-orange: #ff9634; --w-red: #ff5a64;
    --ic-sun: #ffc22e; --ic-moon: #c8d3e1; --ic-cloud: #cfd8e3; --ic-cloud-dark: #8a9bb0;
    --ic-rain: #58acff; --ic-snow: #cfe3ff; --ic-bolt: #ffc22e; --ic-fog: #8e9cad;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141b; --ink: #e7edf4; --ink-2: #b0bfcf; --ink-3: #8696a9; --line: #233040;
  --accent: #6ea8ff; --warm: #ff7d69; --cold: #6cb0ff; --precip: #58acff;
  --w-yellow: #f2c83a; --w-orange: #ff9634; --w-red: #ff5a64;
  --ic-sun: #ffc22e; --ic-moon: #c8d3e1; --ic-cloud: #cfd8e3; --ic-cloud-dark: #8a9bb0;
  --ic-rain: #58acff; --ic-snow: #cfe3ff; --ic-bolt: #ffc22e; --ic-fog: #8e9cad;
  color-scheme: dark;
}
:root[data-bg="clear"] { --bg: transparent; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
a.w { display: flex; flex-direction: column; gap: 6px; height: 100%; padding: 8px 12px; color: inherit; text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--ink-2); min-width: 0; }
.place { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.upd { margin-left: auto; flex: none; color: var(--ink-3); font-size: .74rem; }
.warn { display: inline-flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .76rem; }
.wd { flex: none; width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); background: var(--wc); }
.warn[data-code="YELLOW"] { --wc: var(--w-yellow); } .warn[data-code="ORANGE"] { --wc: var(--w-orange); } .warn[data-code="RED"] { --wc: var(--w-red); }

.main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.main .wxi { flex: none; }
.t { font-size: 2.6rem; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
.t.cold { color: var(--cold); } .t.warm { color: var(--warm); }
.d { display: flex; flex-direction: column; min-width: 0; font-size: .82rem; color: var(--ink-2); }
.d b { color: var(--ink); font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hours { display: flex; justify-content: space-between; gap: 2px; border-top: 1px solid var(--line); padding-top: 4px; margin-top: auto; }
.h { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; font-size: .74rem; color: var(--ink-3); }
.h .tt { color: var(--ink); font-weight: 600; font-size: .84rem; }
.h .p { color: var(--precip); font-weight: 600; min-height: 1.2em; }
.msg { margin: auto; text-align: center; color: var(--ink-2); font-size: .85rem; }

/* Små widgetar: dölj det som inte får plats */
@media (max-height: 150px) { .hours { display: none; } a.w { justify-content: center; } }
@media (max-height: 90px) { .top { display: none; } }
@media (max-width: 230px) { .d { display: none; } .upd { display: none; } .warn span { display: none; } }
/* Hög sida (appen visar hela webbsidan): kortet stannar kompakt överst */
@media (min-height: 320px) { a.w { height: auto; } .hours { margin-top: 2px; } }

.wxi-sun { fill: var(--ic-sun); }
.wxi-ray { stroke: var(--ic-sun); stroke-width: 2.8; stroke-linecap: round; fill: none; }
.wxi-moon { fill: var(--ic-moon); }
.wxi-cloud { fill: var(--ic-cloud); } .wxi-cloud-dark { fill: var(--ic-cloud-dark); }
.wxi-rain { stroke: var(--ic-rain); stroke-width: 3; stroke-linecap: round; fill: none; }
.wxi-snow { fill: var(--ic-snow); }
.wxi-bolt { fill: var(--ic-bolt); }
.wxi-fog { stroke: var(--ic-fog); stroke-width: 3; stroke-linecap: round; fill: none; }
</style>
</head>
<body>
<a class="w" id="w" href="./" target="_blank" rel="noopener"><span class="msg">Hämtar prognos …</span></a>

<script src="forecast-sources.js"></script>
<script src="js/core.js"></script>
<script src="js/demo.js"></script>
<script src="js/warnings.js"></script>
<script>
(() => {
'use strict';
const q = new URLSearchParams(location.search);
const $w = document.getElementById('w');
WX.demoFallback = false;

if (q.get('tema') === 'ljus') document.documentElement.dataset.theme = 'light';
if (q.get('tema') === 'mork' || q.get('tema') === 'mörk') document.documentElement.dataset.theme = 'dark';
if (/^(genomskinlig|transparent)$/.test(q.get('bakgrund') || '')) document.documentElement.dataset.bg = 'clear';

// Plats: från adressen, annars senast visade i samma webbläsare, annars förvalet
const lat = parseFloat(q.get('lat')), lon = parseFloat(q.get('lon'));
const loc = Number.isFinite(lat) && Number.isFinite(lon)
  ? { name: q.get('plats') || `${lat.toFixed(3)}, ${lon.toFixed(3)}`, lat, lon }
  : WX.store.get('wx.loc', WX.PRESETS[0]);
const mode = ['met', 'smhi', 'blend'].includes(q.get('kalla')) ? q.get('kalla') : 'met';
$w.href = './#oversikt';

let raw = null, warnings = [], fetchedAt = null;

function render() {
  if (!raw) return;
  const wd = WX.build(raw, mode), D = wd.data, i = WX.nowIndex(wd), tv = D.temp[i];
  const today = WX.days(wd, loc.lat, loc.lon)[0];
  const top = warnings.find(w => w.code !== 'MESSAGE');
  // Kommande timmar: så många kolumner som får plats, var annan timme
  const cols = Math.max(3, Math.min(8, Math.floor(window.innerWidth / 52)));
  const hours = [];
  for (let k = i + 2; k < wd.n && hours.length < cols; k += 2) {
    const amt = (D.precip_step[k - 1] ?? 0) + (D.precip_step[k] ?? 0);
    hours.push(`<div class="h"><span>${WX.hh(wd.times[k])}</span>${WX.icon(D.symbols[k], 24)}<span class="tt">${WX.fmtTemp(D.temp[k])}</span><span class="p">${amt >= 0.1 ? WX.fmt(amt, 1) : ''}</span></div>`);
  }
  const big = Math.max(40, Math.min(64, Math.round(window.innerHeight * 0.32)));
  $w.innerHTML = `
    <div class="top"><span class="place">${WX.esc(loc.name)}</span>
      ${top ? `<span class="warn" data-code="${top.code}" title="${WX.esc(top.level + ': ' + top.title)}"><i class="wd"></i><span>${WX.esc(top.title)}</span></span>` : ''}
      <span class="upd num">${WX.hhmm(fetchedAt)}</span></div>
    <div class="main">${WX.icon(D.symbols[i], big)}
      <span class="t num ${tv < 0 ? 'cold' : tv >= 20 ? 'warm' : ''}">${WX.fmtTemp(tv)}</span>
      <span class="d"><b>${WX.describe(D.symbols[i])}</b><span>Känns ${WX.fmtTemp(D.feels_like[i])} · ${WX.windDir(D.wind_direction[i])} ${WX.fmt(D.wind[i])} m/s</span>
        ${today ? `<span class="num">Idag ${WX.fmtTemp(today.hi)} / ${WX.fmtTemp(today.lo)}${(today.precip ?? 0) >= 0.1 ? ` · ${WX.fmt(today.precip, today.precip < 10 ? 1 : 0)} mm` : ''}</span>` : ''}</span></div>
    <div class="hours num">${hours.join('')}</div>`;
}

async function load() {
  const demo = WX.wantsDemo();
  try {
    const [r, w] = await Promise.all([
      WX.fetchForecast(loc.lat, loc.lon, { demo }),
      WX.fetchWarnings(loc.lat, loc.lon, { demo }).catch(() => null),
    ]);
    raw = r.raw; fetchedAt = new Date(); warnings = w ? w.list : [];
    render();
  } catch {
    if (!raw) $w.innerHTML = `<span class="msg">${WX.esc(loc.name)}<br>Ingen kontakt med met.no eller SMHI just nu.</span>`;
  }
}

load();
setInterval(load, 30 * 60e3);                         // ny prognos var 30:e minut
setInterval(render, 10 * 60e3);                       // flytta "nu" mellan hämtningarna
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (!fetchedAt || Date.now() - fetchedAt > 15 * 60e3)) load();
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
})();
</script>
</body>
</html>
